<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>CodeyEditor</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./"><span class="brand-mark">C</span><span>CodeyEditor</span></a>
    <span class="version">V0.1.0</span>
    <div class="top-actions">
      <button id="undo" class="tool-button" title="Undo (Ctrl+Z)">↶ Undo</button>
      <button id="redo" class="tool-button" title="Redo (Ctrl+Y)">↷ Redo</button>
      <span class="toolbar-divider"></span>
      <button id="new-project" class="tool-button">New</button>
      <button id="save-project" class="tool-button">Save JSON</button>
      <button id="load-project" class="tool-button">Load JSON</button>
      <button id="export-code" class="primary-button">Export code</button>
      <input id="file-input" type="file" accept=".json,application/json" hidden>
    </div>
  </header>
  <main id="codey-app" class="codey-app"></main>
  <dialog id="export-dialog" class="export-dialog">
    <form method="dialog">
      <div class="dialog-head"><h2>Generated JavaScript</h2><button class="tool-button" aria-label="Close">×</button></div>
      <p class="dialog-description">Starter output generated from the current block stack.</p>
      <textarea id="export-output" spellcheck="false"></textarea>
      <div class="dialog-actions"><button id="copy-export" type="button" class="tool-button">Copy code</button><button class="primary-button">Done</button></div>
    </form>
  </dialog>
  <script type="module" src="./demo.js"></script>
</body>
</html>
